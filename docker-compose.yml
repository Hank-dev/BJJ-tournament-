services:
  tournament-app:
    build: .
    container_name: bjj-tournament-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:?Set ADMIN_PASSCODE in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - tournament_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tournament_data:
